; PlatformIO — 월이(WOLI) ESP32 펌웨어 스켈레톤
; WOLI ESP32 BLE firmware: app command/status GATT protocol.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    h2zero/NimBLE-Arduino@^1.4.3
    madhephaestus/ESP32Servo@^3.0.6
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DLOCK_SERVO_DEGREES=90
    -DUNLOCK_SERVO_DEGREES=10
    -DSERVO_PIN=13
    -DMOTOR_LEFT_IN1=16
    -DMOTOR_LEFT_IN2=17
    -DMOTOR_RIGHT_IN3=18
    -DMOTOR_RIGHT_IN4=19
    -DMOVE_TIME_MS=600
    -DLIMIT_SWITCH_PIN=-1
    -DMOUNT_SENSOR_ACTIVE_LOW=1
    -DSENSOR_STABLE_SAMPLES=4
